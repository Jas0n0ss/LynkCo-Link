name: Bug report (display, audio, installation or controls)
description: Report a problem other than a connection failure or disconnection.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        For USB / Bluetooth / Wi-Fi connection failures, getting stuck opening CarPlay, reconnect loops or disconnects, use the [Connection problem form](https://github.com/Jas0n0ss/OSN-Play/issues/new?template=connection.yml). Connection reports require diagnostic logs.

        Test while parked. Reports are public: review diagnostic files and remove personal information before attaching them. Never post credentials, hotspot passwords or authentication files.
  - type: input
    id: version
    attributes: {label: OSNPlay version, placeholder: 'Exact version from Settings → About, for example 0.1.1-preview'}
    validations: {required: true}
  - type: input
    id: car
    attributes: {label: Lynk & Co model and head unit, placeholder: 'Model/year, OSN and Android version, exact firmware'}
    validations: {required: true}
  - type: input
    id: phone
    attributes: {label: iPhone model and exact iOS version}
    validations: {required: true}
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      options: ['USB', 'Wireless: car hotspot', 'Wireless: Wi-Fi Direct', 'Wireless: Existing Wi-Fi / Same LAN', 'Not connected / app UI only', 'Other / unsure']
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how to reproduce it
      description: 'Include expected behaviour, steps, relevant settings and the approximate failure time. For installation problems, include the installer error and Android version.'
    validations: {required: true}
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report or recording
      description: 'Reproduce on the latest release, then Settings → Diagnostics → Save diagnostic report. Review the text before attaching it. Include the approximate failure time.'
