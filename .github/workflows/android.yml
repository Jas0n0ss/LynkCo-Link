name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Create throwaway release key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass ci-release-pass -keypass ci-release-pass \
            -alias ci -dname "CN=OSNPlay CI" -keyalg RSA -keysize 2048 -validity 1
      - name: Unit tests, lint and Lynk release build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci-release.jks
          ANDROID_KEYSTORE_PASSWORD: ci-release-pass
          ANDROID_KEY_ALIAS: ci
          ANDROID_KEY_PASSWORD: ci-release-pass
        run: >
          ./gradlew
          :shared:testDebugUnitTest
          :common:testDebugUnitTest
          :mobile:lintStandardDebug
          :mobile:assembleLynkRelease
          --stacktrace
      - name: Verify both source builds have no authentication assets
        run: |
          set -euo pipefail
          apk=$(find mobile/build/outputs/apk/lynk/release -name '*.apk' | head -1)
          test -n "$apk"
          if unzip -l "$apk" | grep -qE 'offline-mfi|\.pk8|\.p7b'; then
            echo "Authentication asset found in source-only APK: $apk"
            exit 1
          fi
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OSNPlay-apk
          path: mobile/build/outputs/apk/lynk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OSNPlay-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-standardDebug.html
            mobile/build/reports/lint-results-standardDebug.sarif
          if-no-files-found: warn
          retention-days: 14
