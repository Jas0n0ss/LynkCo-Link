name: Lynk release (standalone)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v0.1.2)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode required signing and authentication inputs
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AUTH_B64: ${{ secrets.OSNPLAY_AUTH_ASSETS_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}" || { echo "ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          test -n "${AUTH_B64:-}" || { echo "OSNPLAY_AUTH_ASSETS_BASE64 is required"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          mkdir -p "$RUNNER_TEMP/auth-assets" "$RUNNER_TEMP/auth-zip"
          printf '%s' "$AUTH_B64" | base64 --decode > "$RUNNER_TEMP/auth-assets.zip"
          unzip -q "$RUNNER_TEMP/auth-assets.zip" -d "$RUNNER_TEMP/auth-zip"
          mkdir -p "$RUNNER_TEMP/auth-assets/offline-mfi"
          cp "$RUNNER_TEMP/auth-zip/offline-mfi/identity.pk8" "$RUNNER_TEMP/auth-assets/offline-mfi/"
          cp "$RUNNER_TEMP/auth-zip/offline-mfi/certificate.p7b" "$RUNNER_TEMP/auth-assets/offline-mfi/"
          test -s "$RUNNER_TEMP/auth-assets/offline-mfi/identity.pk8"
          test -s "$RUNNER_TEMP/auth-assets/offline-mfi/certificate.p7b"
          echo "OSNPLAY_AUTH_ASSETS_DIR=$RUNNER_TEMP/auth-assets" >> "$GITHUB_ENV"
      - name: Unit tests and lint
        run: >
          ./gradlew
          :shared:testDebugUnitTest
          :common:testDebugUnitTest
          :mobile:lintStandardDebug
          --stacktrace
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :mobile:assembleStandaloneLynkRelease --stacktrace
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp mobile/build/outputs/apk/lynk/release/mobile-lynk-release.apk \
            "release-assets/OSNPlay-${VERSION}-lynk-release-standalone.apk"
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-assets
      - name: Publish full release information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          TITLE="OSNPlay ${VERSION} — Lynk&co"
          NOTES_FILE="docs/RELEASE-${VERSION^^}.md"
          FALLBACK="OSNPlay ${VERSION} for Lynk & Co OSN 2.0. Single whitelisted APK with authentication assets; see the README for install steps."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$TITLE" --prerelease=false --latest
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$RELEASE_TAG" --notes-file "$NOTES_FILE"
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease=false --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "$TITLE" \
              --notes "$FALLBACK" \
              --prerelease=false --latest
          fi
